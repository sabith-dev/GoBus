{% extends 'base_agency.html' %}
{% load crispy_forms_tags %}
{% block title %}Settings - GoBus{% endblock %}
{% block content %}
<div class="admin-dash">
    <div class="page-header">
        <div>
            <h1>Settings</h1>
            <p class="page-subtitle">Manage your agency account preferences.</p>
        </div>
        <div class="action-buttons">
            <a href="{% url 'agencies:profile' %}" class="btn btn-outline">View Profile</a>
        </div>
    </div>

    <div class="panel-card" style="max-width: 900px;">
        <div class="panel-head">
            <div class="panel-title">Agency Settings</div>
        </div>
        <div class="panel-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="action-buttons" style="margin-top:1.25rem;">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{% url 'agencies:profile' %}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
